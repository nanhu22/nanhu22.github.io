<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">GIS Agent long-horizon workflow</title><desc id="desc">A blue editorial diagram showing planning, ReAct execution, QGIS and PostGIS tool use, recovery and artifact verification.</desc>
<defs><linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#4d78bd"/></marker></defs>
<rect width="1200" height="720" rx="28" fill="url(#bg2)"/><rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="#cfdcf0"/>
<g font-family="Inter,Arial,sans-serif"><text x="54" y="70" font-size="28" font-weight="700" fill="#0f2e63">GIS Agent</text><text x="54" y="101" font-size="15" fill="#62748c">A long-horizon spatial workflow with explicit planning, tool execution and recovery</text>
<rect x="54" y="144" width="1092" height="94" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="76" y="175" font-size="12" font-weight="700" fill="#2563eb">01 / BUSINESS TASK</text><text x="76" y="205" font-size="18" font-weight="650" fill="#132c50">Count counties → add score → save shapefile → apply graduated style</text><text x="850" y="180" font-size="12" fill="#6b7d94">shared QGIS state</text><text x="850" y="205" font-size="12" fill="#6b7d94">sequential dependency</text>
<rect x="54" y="286" width="260" height="172" rx="18" fill="#eaf2ff" stroke="#8bb2f2"/><text x="78" y="317" font-size="12" font-weight="700" fill="#2563eb">02 / PLANNER</text><text x="78" y="348" font-size="18" font-weight="650" fill="#132c50">Decompose once</text><g font-size="13" fill="#60728a"><text x="78" y="378">1. Load layer</text><text x="78" y="401">2. Count features</text><text x="78" y="424">3. Add + calculate field</text><text x="78" y="447">4. Save + style</text></g>
<rect x="370" y="286" width="340" height="172" rx="18" fill="#07182c" stroke="#2d5fa7"/><text x="394" y="317" font-size="12" font-weight="700" fill="#8db8ff">03 / EXECUTORFLOW</text><text x="394" y="348" font-size="18" font-weight="650" fill="#eaf2ff">ReAct execution loop</text><text x="394" y="377" font-size="13" fill="#9eb3cf">decide tool → execute → observe</text><text x="394" y="401" font-size="13" fill="#9eb3cf">recover on error → continue plan</text><rect x="394" y="421" width="126" height="24" rx="12" fill="#102a4b"/><text x="414" y="438" font-size="11" fill="#cfe1ff">compact state</text><rect x="532" y="421" width="150" height="24" rx="12" fill="#102a4b"/><text x="551" y="438" font-size="11" fill="#cfe1ff">tool observations</text>
<rect x="766" y="286" width="380" height="172" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="790" y="317" font-size="12" font-weight="700" fill="#2563eb">04 / SPATIAL TOOL LAYER</text><g font-size="13"><rect x="790" y="344" width="102" height="62" rx="12" fill="#f5f8fd" stroke="#d1deef"/><text x="817" y="370" font-weight="650" fill="#132c50">QGIS</text><text x="806" y="392" fill="#6b7d94">mutating UI</text><rect x="906" y="344" width="102" height="62" rx="12" fill="#f5f8fd" stroke="#d1deef"/><text x="924" y="370" font-weight="650" fill="#132c50">PostGIS</text><text x="922" y="392" fill="#6b7d94">spatial SQL</text><rect x="1022" y="344" width="100" height="62" rx="12" fill="#f5f8fd" stroke="#d1deef"/><text x="1043" y="370" font-weight="650" fill="#132c50">MLIT</text><text x="1034" y="392" fill="#6b7d94">land data</text></g><text x="790" y="438" font-size="12" fill="#6b7d94">Tools are exposed progressively instead of all at once.</text>
<path d="M314 372H370" stroke="#4d78bd" stroke-width="2" marker-end="url(#a2)"/><path d="M710 372H766" stroke="#4d78bd" stroke-width="2" marker-end="url(#a2)"/><path d="M958 458V500H540V458" fill="none" stroke="#79a2df" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a2)"/><text x="735" y="493" font-size="11" fill="#6b7d94">observation / recovery</text>
<rect x="54" y="526" width="1092" height="128" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="78" y="558" font-size="12" font-weight="700" fill="#2563eb">05 / VERIFIED ARTIFACTS</text><text x="78" y="589" font-size="18" font-weight="650" fill="#132c50">A finished spatial product, not just a text answer</text><g font-size="12" fill="#5f7189"><text x="78" y="618">✓ county count</text><text x="212" y="618">✓ score field</text><text x="337" y="618">✓ saved shapefile</text><text x="488" y="618">✓ graduated style</text></g><rect x="816" y="550" width="290" height="78" rx="12" fill="#edf4ff" stroke="#d3e0f2"/><path d="M842 603L875 574L916 587L956 566L1007 590L1069 570" fill="none" stroke="#5b88cf" stroke-width="3"/><circle cx="875" cy="574" r="5" fill="#2563eb"/><circle cx="956" cy="566" r="5" fill="#2563eb"/><circle cx="1069" cy="570" r="5" fill="#2563eb"/><text x="842" y="619" font-size="10" fill="#6b7d94">artifact preview</text></g>
</svg>