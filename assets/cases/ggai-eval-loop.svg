<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">GGAI evaluation loop</title><desc id="desc">A benchmark loop from validated GIS tasks through runtime execution, trace collection, evaluation, issue classification, fixes and reruns.</desc>
<defs><linearGradient id="bge" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient><marker id="ae" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#557fc0"/></marker></defs>
<rect width="1200" height="720" rx="28" fill="url(#bge)"/><rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="#cfdcf0"/>
<g font-family="Inter,Arial,sans-serif"><text x="54" y="70" font-size="28" font-weight="700" fill="#0f2e63">GGAI · GIS benchmark engineering loop</text><text x="54" y="101" font-size="15" fill="#62748c">The benchmark evaluates complete agent trajectories and feeds concrete failures back into the runtime</text>
<g><rect x="54" y="146" width="244" height="112" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="78" y="178" font-size="12" font-weight="700" fill="#2563eb">01 / BENCHMARK SET</text><text x="78" y="208" font-size="18" font-weight="700" fill="#132c50">Validated GIS tasks</text><text x="78" y="233" font-size="12" fill="#6b7d94">buffer · count · convert · style</text>
<rect x="348" y="146" width="244" height="112" rx="18" fill="#07182c" stroke="#2d5fa7"/><text x="372" y="178" font-size="12" font-weight="700" fill="#8db8ff">02 / REAL RUNTIME</text><text x="372" y="208" font-size="18" font-weight="700" fill="#eef5ff">Execute end to end</text><text x="372" y="233" font-size="12" fill="#9fb3cf">same tools · same harness · real artifacts</text>
<rect x="642" y="146" width="244" height="112" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="666" y="178" font-size="12" font-weight="700" fill="#2563eb">03 / TRACE PACKAGE</text><text x="666" y="208" font-size="18" font-weight="700" fill="#132c50">Collect evidence</text><text x="666" y="233" font-size="12" fill="#6b7d94">events · tool calls · outputs · artifacts</text>
<rect x="936" y="146" width="210" height="112" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="960" y="178" font-size="12" font-weight="700" fill="#2563eb">04 / EVALUATE</text><text x="960" y="208" font-size="18" font-weight="700" fill="#132c50">Judge process</text><text x="960" y="233" font-size="12" fill="#6b7d94">not only final answer</text>
<path d="M298 202H348M592 202H642M886 202H936" stroke="#557fc0" stroke-width="2" marker-end="url(#ae)"/>
<rect x="54" y="318" width="1092" height="146" rx="22" fill="#fff" stroke="#bdd0ec"/><text x="78" y="350" font-size="12" font-weight="700" fill="#2563eb">EVALUATION DIMENSIONS</text><g font-size="13"><rect x="78" y="374" width="160" height="58" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="101" y="408" font-weight="650" fill="#132c50">Business success</text><rect x="252" y="374" width="160" height="58" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="278" y="408" font-weight="650" fill="#132c50">Tool correctness</text><rect x="426" y="374" width="160" height="58" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="455" y="408" font-weight="650" fill="#132c50">Parameter validity</text><rect x="600" y="374" width="160" height="58" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="633" y="408" font-weight="650" fill="#132c50">Recovery quality</text><rect x="774" y="374" width="160" height="58" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="807" y="408" font-weight="650" fill="#132c50">Output validity</text><rect x="948" y="374" width="170" height="58" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="980" y="408" font-weight="650" fill="#132c50">Answer completeness</text></g>
<rect x="54" y="516" width="516" height="132" rx="20" fill="#0f2e63"/><text x="80" y="548" font-size="12" font-weight="700" fill="#8db8ff">CURRENT BUSINESS BENCHMARK</text><text x="80" y="591" font-size="42" font-weight="800" fill="#fff">100%</text><text x="203" y="585" font-size="17" font-weight="650" fill="#e8f1ff">task completion</text><text x="203" y="611" font-size="12" fill="#a9bedc">validated business cases complete successfully</text><text x="80" y="633" font-size="11" fill="#8fa8c9">Environment / missing-path setup issues are tracked separately from business-task success.</text>
<rect x="626" y="516" width="520" height="132" rx="20" fill="#fff" stroke="#bdd0ec"/><text x="652" y="548" font-size="12" font-weight="700" fill="#2563eb">05 / CLOSE THE LOOP</text><text x="652" y="579" font-size="17" font-weight="700" fill="#132c50">Trace failure → classify → fix → rerun</text><text x="652" y="608" font-size="12" fill="#6b7d94">schema gaps · wrong tool selection · recovery chain · context leakage · skill loop</text><path d="M1090 606C1150 680 1040 690 884 675C652 652 530 688 370 664" fill="none" stroke="#557fc0" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#ae)"/></g></g>
</svg>