<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">GGAI single-agent harness architecture</title><desc id="desc">A simplified architecture diagram showing a single-agent runtime, pluggable Skill and MCP capability layer, isolated decision and execution context, subagent dispatch, memory and trace evaluation.</desc>
<defs><linearGradient id="bgh" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#557fc0"/></marker></defs>
<rect width="1200" height="720" rx="28" fill="url(#bgh)"/><rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="#cfdcf0"/>
<g font-family="Inter,Arial,sans-serif"><text x="54" y="70" font-size="28" font-weight="700" fill="#0f2e63">GGAI · Harness at a glance</text><text x="54" y="101" font-size="15" fill="#62748c">Single-agent runtime + pluggable Skill/MCP + isolated execution context</text>
<rect x="66" y="160" width="214" height="104" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="90" y="190" font-size="12" font-weight="700" fill="#2563eb">USER</text><text x="90" y="222" font-size="18" font-weight="700" fill="#132c50">Prompt / clarification</text><text x="90" y="246" font-size="12" fill="#6b7d94">task enters one runtime</text>
<rect x="352" y="132" width="496" height="184" rx="24" fill="#07182c" stroke="#2d5fa7"/><text x="382" y="166" font-size="12" font-weight="700" fill="#8db8ff">SINGLE-AGENT RUNTIME</text><text x="382" y="200" font-size="22" font-weight="750" fill="#f0f6ff">Main Agent decides what happens next</text><rect x="382" y="226" width="198" height="54" rx="12" fill="#102a4b"/><text x="404" y="250" font-size="12" font-weight="650" fill="#dceaff">Decision context</text><text x="404" y="269" font-size="10" fill="#90a8c9">goal · compact history · capability state</text><rect x="596" y="226" width="222" height="54" rx="12" fill="#102a4b"/><text x="620" y="250" font-size="12" font-weight="650" fill="#dceaff">Control plane</text><text x="620" y="269" font-size="10" fill="#90a8c9">permission · memory · trace policy</text>
<path d="M280 212H352" stroke="#557fc0" stroke-width="2" marker-end="url(#ah)"/>
<rect x="66" y="388" width="250" height="196" rx="20" fill="#fff" stroke="#bdd0ec"/><text x="90" y="420" font-size="12" font-weight="700" fill="#2563eb">PLUGGABLE CAPABILITIES</text><g font-size="13" fill="#132c50"><rect x="90" y="446" width="92" height="48" rx="11" fill="#f4f7fb" stroke="#d1deef"/><text x="116" y="476">Skill</text><rect x="194" y="446" width="92" height="48" rx="11" fill="#f4f7fb" stroke="#d1deef"/><text x="222" y="476">MCP</text><rect x="90" y="508" width="196" height="48" rx="11" fill="#edf4ff" stroke="#c8d8ed"/><text x="120" y="538">SubAgent as Tool</text></g><text x="90" y="573" font-size="11" fill="#6b7d94">Capabilities are enabled on demand.</text>
<rect x="360" y="372" width="480" height="230" rx="22" fill="#fff" stroke="#8bb2f2"/><text x="386" y="405" font-size="12" font-weight="700" fill="#2563eb">TOOL / WORKFLOW EXECUTION LAYER</text><text x="386" y="436" font-size="18" font-weight="700" fill="#132c50">Planner + Executor semantics live here</text><g font-size="12"><rect x="386" y="465" width="126" height="64" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="419" y="493" font-weight="650" fill="#132c50">Plan step</text><text x="408" y="514" fill="#6b7d94">tool contract</text><rect x="528" y="465" width="126" height="64" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="556" y="493" font-weight="650" fill="#132c50">Execute</text><text x="554" y="514" fill="#6b7d94">local / MCP</text><rect x="670" y="465" width="144" height="64" rx="12" fill="#f4f7fb" stroke="#d1deef"/><text x="694" y="493" font-weight="650" fill="#132c50">Recover</text><text x="687" y="514" fill="#6b7d94">failure metadata</text></g><rect x="386" y="548" width="428" height="34" rx="10" fill="#edf4ff"/><text x="600" y="570" text-anchor="middle" font-size="11" fill="#526985">Execution context is isolated; only observations return upward.</text>
<rect x="888" y="160" width="246" height="196" rx="20" fill="#fff" stroke="#bdd0ec"/><text x="912" y="192" font-size="12" font-weight="700" fill="#2563eb">MEMORY + CONTEXT</text><text x="912" y="224" font-size="17" font-weight="700" fill="#132c50">Keep context intentionally small</text><text x="912" y="251" font-size="12" fill="#6b7d94">session summary</text><text x="912" y="274" font-size="12" fill="#6b7d94">long-term memory</text><text x="912" y="297" font-size="12" fill="#6b7d94">capability state</text><text x="912" y="320" font-size="12" fill="#6b7d94">artifact references</text>
<rect x="888" y="410" width="246" height="174" rx="20" fill="#0f2e63"/><text x="912" y="442" font-size="12" font-weight="700" fill="#8db8ff">TRACE EVAL</text><text x="912" y="474" font-size="17" font-weight="700" fill="#fff">Observe the trajectory</text><text x="912" y="502" font-size="12" fill="#b5c9e2">tool choice · params · recovery</text><text x="912" y="525" font-size="12" fill="#b5c9e2">task success · output validity</text><text x="912" y="548" font-size="12" fill="#b5c9e2">close the engineering loop</text>
<path d="M600 316V372" stroke="#557fc0" stroke-width="2" marker-end="url(#ah)"/><path d="M316 486H360" stroke="#557fc0" stroke-width="2" marker-end="url(#ah)"/><path d="M888 258H848" stroke="#557fc0" stroke-width="2" marker-end="url(#ah)"/><path d="M840 486H888" stroke="#557fc0" stroke-width="2" marker-end="url(#ah)"/>
<rect x="352" y="636" width="496" height="48" rx="16" fill="#eaf2ff" stroke="#c8d8ed"/><text x="600" y="666" text-anchor="middle" font-size="12" font-weight="650" fill="#244f8e">Decision context ≠ execution context · observations cross the boundary, full traces do not</text></g>
</svg>