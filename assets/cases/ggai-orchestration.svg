<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">GGAI orchestration decision</title><desc id="desc">A general agent routes parallel-safe tasks to isolated subagents and shared-state workflows to direct sequential execution.</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#557fc0"/></marker></defs>
<rect width="1200" height="720" rx="28" fill="url(#g)"/><rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="#cfdcf0"/>
<g font-family="Inter,Arial,sans-serif"><text x="54" y="70" font-size="28" font-weight="700" fill="#0f2e63">GGAI · One runtime, two execution strategies</text><text x="54" y="101" font-size="15" fill="#62748c">The main agent decides whether to delegate isolated work or execute stateful workflows directly</text>
<rect x="430" y="138" width="340" height="100" rx="20" fill="#07182c" stroke="#2d5fa7"/><text x="454" y="169" font-size="12" font-weight="700" fill="#8db8ff">MAIN AGENT</text><text x="454" y="199" font-size="20" font-weight="700" fill="#eef5ff">Plan → choose execution mode</text><text x="454" y="222" font-size="12" fill="#9fb3cf">decision context stays compact</text>
<rect x="54" y="300" width="518" height="290" rx="22" fill="#fff" stroke="#bdd0ec"/><text x="80" y="334" font-size="12" font-weight="700" fill="#2563eb">PARALLEL-SAFE / ISOLATED</text><text x="80" y="365" font-size="18" font-weight="700" fill="#132c50">Fan out to SubAgents</text><text x="80" y="390" font-size="12" fill="#6b7d94">Example: compare independent routes or inspect separate places</text><g font-size="12"><rect x="80" y="428" width="102" height="78" rx="13" fill="#eff5ff" stroke="#c6d7ef"/><text x="105" y="456" font-weight="650" fill="#132c50">SubAgent A</text><text x="105" y="480" fill="#6b7d94">OSM route</text><rect x="198" y="428" width="102" height="78" rx="13" fill="#eff5ff" stroke="#c6d7ef"/><text x="223" y="456" font-weight="650" fill="#132c50">SubAgent B</text><text x="223" y="480" fill="#6b7d94">OSM route</text><rect x="316" y="428" width="102" height="78" rx="13" fill="#eff5ff" stroke="#c6d7ef"/><text x="341" y="456" font-weight="650" fill="#132c50">SubAgent C</text><text x="341" y="480" fill="#6b7d94">OSM route</text><rect x="434" y="428" width="102" height="78" rx="13" fill="#eff5ff" stroke="#c6d7ef"/><text x="459" y="456" font-weight="650" fill="#132c50">SubAgent D</text><text x="459" y="480" fill="#6b7d94">OSM route</text></g><text x="80" y="550" font-size="12" fill="#4f6682">Only result summaries return to the main context; worker traces stay isolated.</text>
<rect x="628" y="300" width="518" height="290" rx="22" fill="#fff" stroke="#bdd0ec"/><text x="654" y="334" font-size="12" font-weight="700" fill="#2563eb">SHARED STATE / SEQUENTIAL</text><text x="654" y="365" font-size="18" font-weight="700" fill="#132c50">Execute on Main Agent</text><text x="654" y="390" font-size="12" fill="#6b7d94">Example: QGIS workflow mutating one shared project</text><g font-size="11" fill="#132c50"><rect x="654" y="428" width="82" height="64" rx="11" fill="#f4f7fb" stroke="#d1deef"/><text x="676" y="458">Load</text><rect x="750" y="428" width="82" height="64" rx="11" fill="#f4f7fb" stroke="#d1deef"/><text x="766" y="458">Count</text><rect x="846" y="428" width="82" height="64" rx="11" fill="#f4f7fb" stroke="#d1deef"/><text x="866" y="458">Score</text><rect x="942" y="428" width="82" height="64" rx="11" fill="#f4f7fb" stroke="#d1deef"/><text x="963" y="458">Save</text><rect x="1038" y="428" width="82" height="64" rx="11" fill="#f4f7fb" stroke="#d1deef"/><text x="1057" y="458">Style</text></g><path d="M736 460H750M832 460H846M928 460H942M1024 460H1038" stroke="#557fc0" stroke-width="2" marker-end="url(#ar)"/><text x="654" y="550" font-size="12" fill="#4f6682">The main agent keeps ownership of mutable external state and executes deterministically.</text>
<path d="M530 238L330 300" stroke="#557fc0" stroke-width="2" marker-end="url(#ar)"/><path d="M670 238L870 300" stroke="#557fc0" stroke-width="2" marker-end="url(#ar)"/>
<rect x="260" y="626" width="680" height="58" rx="18" fill="#0f2e63"/><text x="600" y="650" text-anchor="middle" font-size="12" font-weight="700" fill="#8db8ff">SYNTHESIS BOUNDARY</text><text x="600" y="672" text-anchor="middle" font-size="13" fill="#e5efff">Main Agent receives compact observations → synthesizes the final answer</text></g>
</svg>