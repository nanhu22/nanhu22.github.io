<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Navigation Agent task loop</title><desc id="desc">A restrained editorial diagram showing user intent, ReAct decisions, traffic tools, observations and the final route answer.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#5f86c8"/></marker></defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="718" rx="27" fill="none" stroke="#cfdcf0"/>
<text x="54" y="70" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f2e63">Navigation Agent</text><text x="54" y="101" font-family="Inter,Arial,sans-serif" font-size="15" fill="#62748c">A ReAct loop connected to live traffic tools and data</text>
<g font-family="Inter,Arial,sans-serif"><rect x="54" y="148" width="214" height="112" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="76" y="177" font-size="12" font-weight="700" fill="#2563eb">01 / USER GOAL</text><text x="76" y="207" font-size="18" font-weight="650" fill="#132c50">Plan a route</text><text x="76" y="231" font-size="13" fill="#6b7d94">Tokyo Tower → Shibuya</text><text x="76" y="250" font-size="13" fill="#6b7d94">Check crowd anomaly</text>
<rect x="334" y="148" width="224" height="112" rx="18" fill="#eaf2ff" stroke="#8bb2f2"/><text x="356" y="177" font-size="12" font-weight="700" fill="#2563eb">02 / AGENT STATE</text><text x="356" y="207" font-size="18" font-weight="650" fill="#132c50">Understand + decide</text><text x="356" y="232" font-size="13" fill="#5f7189">intent · route · context</text><text x="356" y="251" font-size="13" fill="#5f7189">next action = tool call</text>
<rect x="624" y="124" width="508" height="160" rx="20" fill="#07182c" stroke="#2d5fa7"/><text x="650" y="154" font-size="12" font-weight="700" fill="#8db8ff">03 / TOOL SPACE</text>
<g font-size="13" fill="#dceaff"><rect x="650" y="177" width="102" height="54" rx="12" fill="#102a4b" stroke="#365f98"/><text x="671" y="209">Maps</text><rect x="770" y="177" width="102" height="54" rx="12" fill="#102a4b" stroke="#365f98"/><text x="800" y="209">RAG</text><rect x="890" y="177" width="102" height="54" rx="12" fill="#102a4b" stroke="#365f98"/><text x="908" y="201">Traffic DB</text><text x="916" y="219" font-size="11" fill="#91a9c8">anomaly</text><rect x="1010" y="177" width="96" height="54" rx="12" fill="#102a4b" stroke="#365f98"/><text x="1027" y="201">Predictor</text><text x="1028" y="219" font-size="11" fill="#91a9c8">forecast</text></g>
<path d="M268 204H334" stroke="#5f86c8" stroke-width="2" marker-end="url(#arrow)"/><path d="M558 204H624" stroke="#5f86c8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="334" y="350" width="224" height="126" rx="18" fill="#fff" stroke="#bdd0ec"/><text x="356" y="379" font-size="12" font-weight="700" fill="#2563eb">04 / OBSERVATION</text><text x="356" y="409" font-size="17" font-weight="650" fill="#132c50">Read tool results</text><text x="356" y="436" font-size="13" fill="#6b7d94">route ETA · crowd state</text><text x="356" y="456" font-size="13" fill="#6b7d94">evidence returned to agent</text>
<path d="M860 284V332H558" fill="none" stroke="#5f86c8" stroke-width="2" marker-end="url(#arrow)"/><path d="M334 413H292V284H446V260" fill="none" stroke="#7da8ff" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="176" y="337" font-size="11" fill="#6b7d94">ReAct loop</text>
<rect x="624" y="350" width="508" height="126" rx="20" fill="#fff" stroke="#bdd0ec"/><text x="650" y="379" font-size="12" font-weight="700" fill="#2563eb">05 / FINAL ANSWER</text><text x="650" y="410" font-size="19" font-weight="700" fill="#132c50">Route + situation, in one response</text><text x="650" y="437" font-size="13" fill="#63758c">Map route is returned together with crowd-risk context and a concise recommendation.</text><path d="M580 413H624" stroke="#5f86c8" stroke-width="2" marker-end="url(#arrow)"/>
<g transform="translate(54 544)"><rect width="1078" height="112" rx="18" fill="#f7faff" stroke="#d5e1f2"/><text x="22" y="31" font-size="12" font-weight="700" fill="#2563eb">WHAT THIS CASE PROVES</text><text x="22" y="61" font-size="16" font-weight="650" fill="#132c50">The agent does not memorize a workflow.</text><text x="22" y="86" font-size="13" fill="#6b7d94">It keeps a compact task state, chooses the next tool from observations, and only carries forward the evidence needed for the next decision.</text></g></g>
</svg>